[package]
name = "uniasset"
version = "0.2.1"
edition = "2024"

[dependencies]
libwebp-sys = "0.13"
stb_image = "0.3.0"
anyhow = "1.0.102"
zune-jpeg = "0.5.12"
symphonia = { version = "0.6", default-features = false, features = [
    "mp3",
    "flac",
    "wav",
    "pcm",
    "vorbis",
    "ogg",
    # 注册 ID3v2 metadata reader：MP3 帧头前的超大 ID3v2 标签（如内嵌封面 >1MB）
    # 否则 probe 无法识别 "ID3" 标记，会在默认 1MB 扫描上限处报
    # "reached probe limit" 而拒绝加载。
    "id3v2",
] }
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
parking_lot = "0.12.5"

[lib]
name = "uniasset"
